<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" font-family="Inter,Segoe UI,sans-serif" font-size="13">
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3ddc97"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b84b"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a7a"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2c3a5c"/></marker></defs>
<rect width="1100" height="630" rx="16" fill="#0f1524"/><text x="24" y="34" fill="#e6ebf5" font-size="16" font-weight="700">Delivery guarantee: ack, then commit</text><rect x="40" y="55" width="160" height="40" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="120.0" y="80.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Kafka</text><line x1="120" y1="95" x2="120" y2="610" stroke="#2c3a5c" stroke-dasharray="4 4"/><rect x="300" y="55" width="160" height="40" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="380.0" y="80.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Consumer</text><line x1="380" y1="95" x2="380" y2="610" stroke="#2c3a5c" stroke-dasharray="4 4"/><rect x="560" y="55" width="160" height="40" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="640.0" y="80.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">ClickHouse</text><line x1="640" y1="95" x2="640" y2="610" stroke="#2c3a5c" stroke-dasharray="4 4"/><rect x="820" y="55" width="160" height="40" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="900.0" y="80.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Offsets (Kafka)</text><line x1="900" y1="95" x2="900" y2="610" stroke="#2c3a5c" stroke-dasharray="4 4"/><path d="M380 135 L123 135" fill="none" stroke="#7aa2ff" stroke-width="1.8"  marker-end="url(#mb)"/><text x="251.5" y="128.0" fill="#8b98b8" font-size="11" text-anchor="middle">poll(batch)</text><path d="M120 170 L377 170" fill="none" stroke="#7aa2ff" stroke-width="1.8"  marker-end="url(#mb)"/><text x="248.5" y="163.0" fill="#8b98b8" font-size="11" text-anchor="middle">records (Avro)</text><rect x="300" y="190" width="160" height="34" rx="10" fill="#151d31" stroke="#2c3a5c" stroke-width="1.5"/><text x="380.0" y="212.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">empty batch?</text><text x="470" y="212" fill="#8b98b8" font-size="11" text-anchor="start" font-weight="400">yes → skip commit, poll again</text><rect x="300" y="240" width="160" height="34" rx="10" fill="#151d31" stroke="#2c3a5c" stroke-width="1.5"/><text x="380.0" y="262.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">decode + map columns</text><path d="M380 300 L637 300" fill="none" stroke="#7aa2ff" stroke-width="1.8"  marker-end="url(#mb)"/><text x="508.5" y="293.0" fill="#8b98b8" font-size="11" text-anchor="middle">INSERT batch</text><rect x="40" y="320" width="1020" height="110" rx="14" fill="none" stroke="#3ddc97" stroke-dasharray="6 5" opacity=".8"/><text x="52" y="338" fill="#3ddc97" font-size="11" font-weight="600">alt: write confirmed</text><path d="M640 355 L383 355" fill="none" stroke="#3ddc97" stroke-width="1.8"  marker-end="url(#mg)"/><text x="511.5" y="348.0" fill="#8b98b8" font-size="11" text-anchor="middle">ack (insert ok)</text><path d="M380 395 L897 395" fill="none" stroke="#3ddc97" stroke-width="1.8"  marker-end="url(#mg)"/><text x="638.5" y="388.0" fill="#8b98b8" font-size="11" text-anchor="middle">commit offsets</text><rect x="40" y="450" width="1020" height="140" rx="14" fill="none" stroke="#ff7a7a" stroke-dasharray="6 5" opacity=".8"/><text x="52" y="468" fill="#ff7a7a" font-size="11" font-weight="600">alt: write failed / timeout</text><path d="M640 485 L383 485" fill="none" stroke="#ff7a7a" stroke-width="1.8"  marker-end="url(#mr)"/><text x="511.5" y="478.0" fill="#8b98b8" font-size="11" text-anchor="middle">error</text><rect x="300" y="505" width="160" height="40" rx="10" fill="#151d31" stroke="#ff7a7a" stroke-width="1.5"/><text x="380.0" y="521.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">stop consumer</text><text x="380.0" y="538.0" fill="#8b98b8" text-anchor="middle" font-size="11">no commit</text><text x="480" y="525" fill="#8b98b8" font-size="12" text-anchor="start" font-weight="400">Offsets stay at the last confirmed batch. Nagios raises the alert.</text><text x="480" y="545" fill="#8b98b8" font-size="12" text-anchor="start" font-weight="400">After the fix, restart replays from there. Versioned tables absorb the duplicates.</text><text x="60" y="575" fill="#f2b84b" font-size="12" text-anchor="start" font-weight="400">New consumer groups start from earliest, never latest.</text></svg>