<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" font-family="Inter,Segoe UI,sans-serif" font-size="13">
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3ddc97"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b84b"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7a7a"/></marker><marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2c3a5c"/></marker></defs>
<rect width="1100" height="550" rx="16" fill="#0f1524"/><text x="24" y="34" fill="#e6ebf5" font-size="16" font-weight="700">High availability and failover</text><rect x="20" y="60" width="500" height="250" rx="14" fill="none" stroke="#7aa2ff" stroke-dasharray="6 5" opacity=".8"/><text x="32" y="78" fill="#7aa2ff" font-size="11" font-weight="600">KRaft controller quorum + brokers</text><rect x="45" y="95" width="140" height="60" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="115.0" y="121.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Node 1</text><text x="115.0" y="138.0" fill="#8b98b8" text-anchor="middle" font-size="11">controller + broker</text><rect x="205" y="95" width="140" height="60" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="275.0" y="121.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Node 2</text><text x="275.0" y="138.0" fill="#8b98b8" text-anchor="middle" font-size="11">controller + broker</text><rect x="365" y="95" width="140" height="60" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="435.0" y="121.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Node 3</text><text x="435.0" y="138.0" fill="#8b98b8" text-anchor="middle" font-size="11">controller + broker</text><text x="270" y="190" fill="#8b98b8" font-size="12" text-anchor="middle" font-weight="400">Majority quorum: the cluster keeps running if one node is lost</text><rect x="45" y="210" width="450" height="80" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="270.0" y="246.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Topic partitions replicated across nodes</text><text x="270.0" y="263.0" fill="#8b98b8" text-anchor="middle" font-size="11">leader + followers · in-sync replicas (ISR)</text><text x="270.0" y="278.0" fill="#8b98b8" text-anchor="middle" font-size="11">producers wait for ISR acks · leader moves to an ISR follower on failure</text><rect x="540" y="60" width="540" height="250" rx="14" fill="none" stroke="#3ddc97" stroke-dasharray="6 5" opacity=".8"/><text x="552" y="78" fill="#3ddc97" font-size="11" font-weight="600">Kafka Connect: distributed workers</text><rect x="565" y="100" width="150" height="60" rx="10" fill="#151d31" stroke="#3ddc97" stroke-width="1.5"/><text x="640.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Worker A</text><text x="640.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">Debezium tasks</text><rect x="745" y="100" width="150" height="60" rx="10" fill="#151d31" stroke="#3ddc97" stroke-width="1.5"/><text x="820.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Worker B</text><text x="820.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">Debezium tasks</text><rect x="925" y="100" width="130" height="60" rx="10" fill="#151d31" stroke="#3ddc97" stroke-width="1.5"/><text x="990.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Worker C</text><text x="990.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">standby / tasks</text><rect x="565" y="200" width="490" height="80" rx="10" fill="#151d31" stroke="#3ddc97" stroke-width="1.5"/><text x="810.0" y="236.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Worker lost → group rebalances</text><text x="810.0" y="253.0" fill="#8b98b8" text-anchor="middle" font-size="11">connector tasks reassigned to live workers</text><text x="810.0" y="268.0" fill="#8b98b8" text-anchor="middle" font-size="11">resume from stored source offsets (binlog position)</text><path d="M810 162 L810 198" fill="none" stroke="#3ddc97" stroke-width="1.8"  marker-end="url(#mg)"/><rect x="20" y="330" width="1060" height="200" rx="14" fill="none" stroke="#f2b84b" stroke-dasharray="6 5" opacity=".8"/><text x="32" y="348" fill="#f2b84b" font-size="11" font-weight="600">Consumer groups</text><rect x="45" y="370" width="230" height="70" rx="10" fill="#151d31" stroke="#ff7a7a" stroke-width="1.5"/><text x="160.0" y="401.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Consumer instance fails</text><text x="160.0" y="418.0" fill="#8b98b8" text-anchor="middle" font-size="11">partitions released</text><rect x="320" y="370" width="230" height="70" rx="10" fill="#151d31" stroke="#f2b84b" stroke-width="1.5"/><text x="435.0" y="401.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Group rebalance</text><text x="435.0" y="418.0" fill="#8b98b8" text-anchor="middle" font-size="11">another member takes over</text><rect x="595" y="370" width="230" height="70" rx="10" fill="#151d31" stroke="#f2b84b" stroke-width="1.5"/><text x="710.0" y="401.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Resume from last commit</text><text x="710.0" y="418.0" fill="#8b98b8" text-anchor="middle" font-size="11">= last ClickHouse-confirmed batch</text><rect x="870" y="370" width="190" height="70" rx="10" fill="#151d31" stroke="#3ddc97" stroke-width="1.5"/><text x="965.0" y="401.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">No gap, no skip</text><text x="965.0" y="418.0" fill="#8b98b8" text-anchor="middle" font-size="11">replays are idempotent</text><text x="965.0" y="433.0" fill="#8b98b8" text-anchor="middle" font-size="11">(versioned tables)</text><path d="M275 405 L318 405" fill="none" stroke="#f2b84b" stroke-width="1.8"  marker-end="url(#my)"/><path d="M550 405 L593 405" fill="none" stroke="#f2b84b" stroke-width="1.8"  marker-end="url(#my)"/><path d="M825 405 L868 405" fill="none" stroke="#f2b84b" stroke-width="1.8"  marker-end="url(#my)"/><text x="45" y="475" fill="#8b98b8" font-size="12" text-anchor="start" font-weight="400">Planned recycle: consumers restart in batches. Each batch waits out a hold time and must be healthy</text><text x="45" y="495" fill="#8b98b8" font-size="12" text-anchor="start" font-weight="400">before the next one goes, so we never restart everything at once.</text></svg>