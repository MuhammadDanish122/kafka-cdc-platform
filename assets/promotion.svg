<rect width="1100" height="320" rx="16" fill="#0f1524"/><text x="24" y="34" fill="#e6ebf5" font-size="16" font-weight="700">Release promotion</text><rect x="30" y="90" width="180" height="80" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="120.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Local / dev</text><text x="120.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">build + test</text><rect x="242" y="90" width="180" height="80" rx="10" fill="#151d31" stroke="#7aa2ff" stroke-width="1.5"/><text x="332.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Staging</text><text x="332.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">tag deployed</text><text x="332.0" y="158.0" fill="#8b98b8" text-anchor="middle" font-size="11">soak + checks</text><path d="M212 130 L240 130" fill="none" stroke="#7aa2ff" stroke-width="1.8"  marker-end="url(#mb)"/><rect x="454" y="90" width="180" height="80" rx="10" fill="#151d31" stroke="#f2b84b" stroke-width="1.5"/><text x="544.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Dry run</text><text x="544.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">prod tag against prod</text><text x="544.0" y="158.0" fill="#8b98b8" text-anchor="middle" font-size="11">nothing applied</text><path d="M424 130 L452 130" fill="none" stroke="#7aa2ff" stroke-width="1.8"  marker-end="url(#mb)"/><rect x="666" y="90" width="180" height="80" rx="10" fill="#151d31" stroke="#f2b84b" stroke-width="1.5"/><text x="756.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Sign-off</text><text x="756.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">manual approval</text><path d="M636 130 L664 130" fill="none" stroke="#7aa2ff" stroke-width="1.8"  marker-end="url(#mb)"/><rect x="878" y="90" width="180" height="80" rx="10" fill="#151d31" stroke="#3ddc97" stroke-width="1.5"/><text x="968.0" y="126.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Production</text><text x="968.0" y="143.0" fill="#8b98b8" text-anchor="middle" font-size="11">same tag promoted</text><path d="M848 130 L876 130" fill="none" stroke="#7aa2ff" stroke-width="1.8"  marker-end="url(#mb)"/><rect x="30" y="220" width="390" height="70" rx="10" fill="#151d31" stroke="#2c3a5c" stroke-width="1.5"/><text x="225.0" y="251.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Git tag = release</text><text x="225.0" y="268.0" fill="#8b98b8" text-anchor="middle" font-size="11">same artifact moves through every environment</text><rect x="450" y="220" width="620" height="70" rx="10" fill="#151d31" stroke="#ff7a7a" stroke-width="1.5"/><text x="760.0" y="251.0" fill="#e6ebf5" text-anchor="middle" font-weight="600">Env-specific runtime flags stay on each host</text><text x="760.0" y="268.0" fill="#8b98b8" text-anchor="middle" font-size="11">excluded from deploys · risky toggles (bulk dedup, backfill) off by default</text></svg>